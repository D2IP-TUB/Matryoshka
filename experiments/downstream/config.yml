regression:
  forward:
    baseline: false
    task: regression
    ranking: passthrough
    model: RegressionQR
    strategy: ForwardSelection
    params:
      tol: 0.01
      metric: mse
    
  backward:
    baseline: false
    task: regression
    ranking: correlation
    model: RegressionQR
    strategy: BackwardElimination
    params:
      tol: 0.01
      metric: mse

  lasso:
    baseline: false
    task: regression
    model: LinRegL1
    strategy: LassoFeatureSelector
    params:
      alphas:
        - 100.0
        - 10.0
        - 0.1
        - 0.001
      metric: mse
      cv: 3

  arda:
    strategy: ArdaAugmenter
    baseline: true
    params:
      regression: true
      sample_size: 3000

  qcr:
    strategy: QcrAugmenter
    baseline: true
    params:
      top_k: 50

  kitana:
    strategy: KitanaAugmenter
    baseline: true
    params:
      n_iter: 10

  autofeat:
    strategy: AutofeatAugmenter
    baseline: true
    params:
      top_k: 15
      sample_size: 3000

classification:
  forward:
    baseline: false
    task: classification
    ranking: passthrough
    model: ClassificationCholesky
    strategy: ForwardSelection
    params:
      tol: 0.3
      metric: average_mahalanobis

  backward:
    baseline: false
    task: classification
    ranking: eta
    model: ClassificationCholesky
    strategy: BackwardElimination
    params:
      tol: 0.3
      metric: average_mahalanobis

  lasso:
    baseline: false
    task: classification
    model: LogRegL1
    strategy: LassoFeatureSelector
    params:
      alphas:
        - 100.0
        - 10.0
        - 0.1
        - 0.001
      metric: accuracy
      cv: 3
  
  arda:
    strategy: ArdaAugmenter
    baseline: true
    params:
      regression: false
      sample_size: 3000

  qcr:
    strategy: QcrAugmenter
    baseline: true
    params:
      top_k: 50

  kitana:
    strategy: KitanaAugmenter
    baseline: true
    params:
      n_iter: 10
  
  autofeat:
    strategy: AutofeatAugmenter
    baseline: true
    params:
      top_k: 15
      sample_size: 3000